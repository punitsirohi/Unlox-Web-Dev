<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Div Container - It is Box in which we can add content by using 
    any HTML Tag - It always take 100% width - By Defaut
    Block Level element/tag -->

    <div style="background-color: bisque; width: 300px;">
        <h2>Review</h2>

        <div style="background-color: cornflowerblue; width: 200px;">
            <h3>Ayush</h3>
            <p>It is good ⭐⭐⭐⭐</p>
        </div>

        <div style="background-color: cornflowerblue; width: 200px;">
            <h3>Punit</h3>
            <p>It is great ⭐⭐⭐⭐⭐</p>
        </div>

    </div>

    <div style="background-color: blanchedalmond; width: 300px;">
        <h2>Support</h2>
        <p>abc@gmai.com</p>
        <p>+91 1234567890</p>
        <p>Location , India , Meetut </p>
    </div>

    <!-- Span Tag - It only take required amount of width as per content
    Inline element - It can fit inside any HTML tag -->

    <p>Good <span style="background-color: hsl(262, 89%, 41%);">Morning</span> Punit!</p>

</body>
</html>
