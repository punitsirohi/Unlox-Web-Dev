<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Username</label>
    <input placeholder="Enter Your Name"><br><br>

    <!-- Input Types -->

    <input type="text" placeholder="Enter Your Username" required minlength="3" maxlength="10"><br><br>

    <input type="email" placeholder="Enter Your Email"><br><br>

    <input type="password" placeholder="Enter Your Password" required><br><br>

    <input type="url" placeholder="https://url.com"><br><br> 

    <input type="tel" placeholder="+91 1234567895"><br><br>

    <!-- Date And Time -->
    <input type="date">
    <input type="time">

    <input type="datetime-local">
    <input type="month">
    <input type="week"><br><br>

    <!-- Selection Box -->
    <input type="checkbox">
    <label>I Agree To all the tearms and conditions.</label><br><br>

    <!-- Special Input -->
    <input type="file"><br><br>
    <input type="color"><br><br>
    <input type="range"><br><br>
    <input type="number" placeholder="Number"><br><br>

    <!-- Validation -->
    <input type="text" placeholder="Username" required><br><br>

    <input type="tel" placeholder="Phone No." pattern="[0-9][10]"><br><br>

    <!-- Feedback and Review -->
    <textarea placeholder="Feedback" rows="10"></textarea>




</body>
</html>
